[project]
name = "py-starter"
version = "0.1.0"
description = "Async-first FastAPI application template for building microservices and data processing APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3==14.3.0",
    "aiofiles==24.1.0",
    "aiohttp==3.12.12",
    "aiomysql==0.2.0",
    "backoff==2.2.1",
    "croniter==6.0.0",
    "fastapi==0.115.12",
    "motor==3.7.1",
    "pydantic==2.11.5",
    "pymongo==4.13.1",
    "python-dotenv==1.1.0",
    "redis==6.2.0",
    "slowapi==0.1.9",
    "uvicorn==0.34.3",
    "uvloop==0.21.0",
]

[project.optional-dependencies]
types = [
    "boto3-stubs==1.38.38",
    "mypy-boto3-s3==1.38.26",
    "types-aioboto3==14.3.0",
    "types-aiobotocore==2.23.0",
    "types-aiobotocore-s3==2.22.0",
    "types-awscrt==0.27.2",
    "types-s3transfer==0.13.0",
]

[dependency-groups]
# Installed by default with `uv sync` and `uv run`. Use `uv sync --no-dev` in production.
dev = [
    "ruff==0.13.0",
    "mypy==1.16.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "fakeredis==2.26.2",
    "types-aiofiles==24.1.0.20250606",
    "types-croniter==6.0.0.20250809",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # flake8-eradicate
    "Q",      # flake8-quotes
    "ASYNC",  # flake8-async
    "ARG",    # flake8-unused-arguments
    "COM",    # flake8-commas
]
ignore = [
    "E501",   # Line too long - let the formatter handle this
    "COM812", # Trailing comma missing - conflicts with formatter
    "ISC001", # Single line implicit string concatenation - conflicts with formatter
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["src", "boot", "app"]

[tool.ruff.lint.per-file-ignores]
# Laravel-style camelCase helpers are intentional
"src/schedule/async_scheduler.py" = ["N802"]
# Example / demo code prints on purpose
"src/schedule/example_usage.py" = ["T201"]
# Tests can have long lines, unused arguments, etc.
"tests/**/*.py" = ["E501", "ARG001", "ARG002", "ARG005", "DTZ", "EM", "SIM117", "ASYNC", "ERA001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
disallow_any_generics = false
disallow_subclassing_any = false
# Third-party packages without stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = """
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=src
    --cov=app
    --cov=boot
    --cov-report=term-missing:skip-covered
    --cov-branch
"""
filterwarnings = [
    "ignore::DeprecationWarning:aiomysql",
    "ignore::DeprecationWarning:motor",
    "ignore::DeprecationWarning:fakeredis",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "src/schedule/example_usage.py",
    "src/app/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
