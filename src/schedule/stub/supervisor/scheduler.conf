; Copy to /etc/supervisor/conf.d/scheduler.conf and replace the paths below with
; your project root and the output of `which python` inside your venv.
[program:scheduler]
; src.schedule.tasks = your module that registers tasks and calls `await scheduler.start()`
command=/home/ubuntu/apps/py-starter/.venv/bin/python -m src.schedule.tasks
directory=/home/ubuntu/apps/py-starter
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PATH="/home/ubuntu/.local/bin:/usr/local/bin:/usr/bin:/bin",PYTHONPATH="/home/ubuntu/apps/py-starter"
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
stopasgroup=true
